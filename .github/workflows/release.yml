name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to release (for example v0.1.5)'
        required: true
        type: string
      publish:
        description: 'Publish verified binaries and update the installer'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && 'publish-release' || format('validate-release-{0}', github.ref) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
          PUBLISH: ${{ inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit("Stable releases require a major.minor.patch version")
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          locked = next(p["version"] for p in lock["package"] if p["name"] == "clawblox")
          if locked != version:
              raise SystemExit("Cargo.toml and Cargo.lock versions differ")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if os.environ["PUBLISH"] == "true":
              tag = "v" + version
              if os.environ["RELEASE_REF"] != tag:
                  raise SystemExit(f"Publishing requires tag {tag}")
              tagged = subprocess.check_output(
                  ["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True
              ).strip()
              if tagged != sha:
                  raise SystemExit("Checkout does not match the release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nsha={sha}\n")
          PY

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            platform: win32-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: runner.os == 'Linux'
        run: cargo install cross --locked

      - name: Build (Linux with cross)
        if: runner.os == 'Linux'
        run: cross build --locked --release --target ${{ matrix.target }} --bin clawblox

      - name: Build (macOS/Windows)
        if: runner.os != 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }} --bin clawblox

      - name: Check CLI version and help (native Unix)
        if: runner.os != 'Windows' && matrix.platform != 'linux-arm64'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(target/${{ matrix.target }}/release/clawblox --version)" = "clawblox $RELEASE_VERSION"
          target/${{ matrix.target }}/release/clawblox --help

      - name: Check CLI version and help (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $version = & target/${{ matrix.target }}/release/clawblox.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "clawblox $env:RELEASE_VERSION") {
            throw "Unexpected CLI version: $version"
          }
          & target/${{ matrix.target }}/release/clawblox.exe --help
          if ($LASTEXITCODE -ne 0) { throw "CLI help failed" }

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/clawblox dist/${{ matrix.platform }}/clawblox
          chmod +x dist/${{ matrix.platform }}/clawblox

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.platform }}
          Copy-Item target/${{ matrix.target }}/release/clawblox.exe dist/${{ matrix.platform }}/clawblox.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}

  release:
    name: Upload to R2
    needs: [prepare, build]
    if: inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prevent overwriting or downgrading a published release
        run: |
          LATEST=$(curl -fsSL https://releases.clawblox.com/latest)
          export LATEST
          python3 - <<'PY'
          import os
          def parts(version):
              return tuple(map(int, version.strip().split(".")))
          if parts(os.environ["VERSION"]) <= parts(os.environ["LATEST"]):
              raise SystemExit("Release version must be newer than the published version")
          PY

      - name: Calculate checksums and create manifest
        run: |
          # Calculate checksums for all binaries
          LINUX_X64=$(sha256sum dist/linux-x64/clawblox | cut -d' ' -f1)
          LINUX_ARM64=$(sha256sum dist/linux-arm64/clawblox | cut -d' ' -f1)
          DARWIN_X64=$(sha256sum dist/darwin-x64/clawblox | cut -d' ' -f1)
          DARWIN_ARM64=$(sha256sum dist/darwin-arm64/clawblox | cut -d' ' -f1)
          WIN32_X64=$(sha256sum dist/win32-x64/clawblox.exe | cut -d' ' -f1)
          WIN32_ARM64=$(sha256sum dist/win32-arm64/clawblox.exe | cut -d' ' -f1)

          echo "Checksums:"
          echo "  linux-x64: $LINUX_X64"
          echo "  linux-arm64: $LINUX_ARM64"
          echo "  darwin-x64: $DARWIN_X64"
          echo "  darwin-arm64: $DARWIN_ARM64"
          echo "  win32-x64: $WIN32_X64"
          echo "  win32-arm64: $WIN32_ARM64"

          cat > dist/manifest.json << EOF
          {
            "version": "$VERSION",
            "commit": "$RELEASE_SHA",
            "platforms": {
              "linux-x64": {
                "checksum": "$LINUX_X64"
              },
              "linux-arm64": {
                "checksum": "$LINUX_ARM64"
              },
              "darwin-x64": {
                "checksum": "$DARWIN_X64"
              },
              "darwin-arm64": {
                "checksum": "$DARWIN_ARM64"
              },
              "win32-x64": {
                "checksum": "$WIN32_X64"
              },
              "win32-arm64": {
                "checksum": "$WIN32_ARM64"
              }
            }
          }
          EOF
          cat dist/manifest.json

      - name: Install rclone
        run: |
          curl -fsSLO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          EOF

      - name: Upload to R2
        run: |
          # Upload versioned release
          rclone copy dist/linux-x64/clawblox r2:clawblox-releases/$VERSION/linux-x64/ --s3-no-check-bucket
          rclone copy dist/linux-arm64/clawblox r2:clawblox-releases/$VERSION/linux-arm64/ --s3-no-check-bucket
          rclone copy dist/darwin-x64/clawblox r2:clawblox-releases/$VERSION/darwin-x64/ --s3-no-check-bucket
          rclone copy dist/darwin-arm64/clawblox r2:clawblox-releases/$VERSION/darwin-arm64/ --s3-no-check-bucket
          rclone copy dist/win32-x64/clawblox.exe r2:clawblox-releases/$VERSION/win32-x64/ --s3-no-check-bucket
          rclone copy dist/win32-arm64/clawblox.exe r2:clawblox-releases/$VERSION/win32-arm64/ --s3-no-check-bucket
          rclone copy dist/manifest.json r2:clawblox-releases/$VERSION/ --s3-no-check-bucket
          rclone copy scripts/install.sh r2:clawblox-releases/ --s3-no-check-bucket
          rclone copy scripts/install.ps1 r2:clawblox-releases/ --s3-no-check-bucket
          rclone copy scripts/install.cmd r2:clawblox-releases/ --s3-no-check-bucket

      - name: Verify uploaded release before promoting it
        run: |
          rclone check dist "r2:clawblox-releases/$VERSION" --one-way --download --s3-no-check-bucket
          curl -fsSL "https://releases.clawblox.com/$VERSION/manifest.json" -o published-manifest.json
          cmp dist/manifest.json published-manifest.json
          for script in install.sh install.ps1 install.cmd; do
            curl -fsSL "https://releases.clawblox.com/$script" -o "published-$script"
            cmp "scripts/$script" "published-$script"
          done

      - name: Promote release
        run: |
          # Update latest pointer
          echo -n "$VERSION" > latest.txt
          rclone copy latest.txt r2:clawblox-releases/ --s3-no-check-bucket
          rclone moveto r2:clawblox-releases/latest.txt r2:clawblox-releases/latest --s3-no-check-bucket

      - name: Verify upload
        run: |
          test "$(curl -fsSL https://releases.clawblox.com/latest)" = "$VERSION"
          curl -fsSI "https://releases.clawblox.com/$VERSION/manifest.json"
          curl -fsSI https://releases.clawblox.com/install.sh
          curl -fsSI https://releases.clawblox.com/install.ps1
          curl -fsSI https://releases.clawblox.com/install.cmd

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawblox App</title>
    <link rel="stylesheet" href="ui/app/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="Explorer">
        <div class="sidebar__titlebar">
          <div class="sidebar__label">Explorer</div>
          <div id="project-root" class="sidebar__project">Loading...</div>
        </div>
        <div id="tree" class="tree" role="tree" aria-label="Recordings"></div>
      </aside>

      <main class="workspace" aria-label="Replay">
        <div class="workspace__bar">
          <div id="selection-title" class="workspace__title">No recording selected</div>
          <div id="selection-meta" class="workspace__meta"></div>
        </div>
        <div class="workspace__body">
          <div id="viewer-empty" class="workspace__empty">Select a recording</div>
          <iframe id="viewer" class="viewer" title="Replay viewer" hidden></iframe>
        </div>
      </main>
    </div>
    <script type="module" src="ui/app/main.js"></script>
  </body>
</html>
